{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#2563eb">
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js');
}
</script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Smart Vision</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #101922;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
        }
        .left-panel {
            display: none;
            width: 50%;
            min-height: 100vh;
            background: #0c1219;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            border-right: 1px solid #1e2a38;
        }
        .brand-title { font-size: 2.5rem; font-weight: 700; color: white; margin-bottom: 0.5rem; }
        .brand-tagline { font-size: 1rem; color: #7a8a9e; }
        .right-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .form-box { width: 100%; max-width: 420px; }
        .form-title { font-size: 1.75rem; font-weight: 700; color: white; margin-bottom: 0.25rem; }
        .form-subtitle { color: #7a8a9e; font-size: 0.9rem; margin-bottom: 1.5rem; }

        .error-box {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.4);
            border-radius: 6px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            color: #f87171;
            font-size: 0.85rem;
        }
        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block; font-size: 0.85rem; font-weight: 500;
            color: #c0c8d4; margin-bottom: 0.4rem;
        }
        .form-group input {
            width: 100%; height: 44px; padding: 0 12px;
            background: #192633; border: 1px solid #2e3e50;
            border-radius: 6px; color: white; font-size: 0.9rem; font-family: inherit;
        }
        .form-group input:focus { outline: none; border-color: #2563eb; }
        .form-group input::placeholder { color: #556677; }

        .form-row { display: grid; grid-template-columns: 1fr; gap: 0; }

        .terms-row {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 1rem; font-size: 0.8rem; color: #7a8a9e;
        }
        .terms-row input { width: 16px; height: 16px; }
        .terms-row a { color: #2563eb; text-decoration: underline; }

        .submit-btn {
            width: 100%; height: 44px; background: #2563eb; color: white;
            border: none; border-radius: 6px; font-size: 0.95rem;
            font-weight: 600; cursor: pointer; font-family: inherit;
        }
        .submit-btn:hover { background: #1d4ed8; }

        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 1.25rem 0; color: #556677; font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: #2e3e50;
        }

        .oauth-buttons { display: flex; flex-direction: column; gap: 10px; }
        .oauth-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; height: 44px; background: #192633;
            border: 1px solid #2e3e50; border-radius: 6px;
            color: #c0c8d4; font-size: 0.85rem; font-weight: 500;
            text-decoration: none; font-family: inherit; cursor: pointer;
        }
        .oauth-btn:hover { background: #1e2e3f; border-color: #3e5060; }
        .oauth-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

        .footer-text {
            text-align: center; margin-top: 1.5rem;
            font-size: 0.85rem; color: #7a8a9e;
        }
        .footer-text a { color: #2563eb; text-decoration: none; font-weight: 500; }
        .footer-text a:hover { text-decoration: underline; }

        @media (min-width: 768px) { .form-row { grid-template-columns: 1fr 1fr; gap: 1rem; } }
        @media (min-width: 1024px) { .left-panel { display: flex; } }
    </style>
</head>
<body>
    <div class="left-panel">
        <h1 class="brand-title">Smart Vision</h1>
        <p class="brand-tagline">AI-Powered Object Detection</p>
    </div>

    <div class="right-panel">
        <div class="form-box">
            <h2 class="form-title">Create Account</h2>
            <p class="form-subtitle">Get started with Smart Vision</p>

            {% if error %}
            <div class="error-box">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{% url 'signup' %}">
                {% csrf_token %}

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="full_name" placeholder="John Doe" required />
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="name@example.com" required />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" placeholder="Min 8 characters" required />
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" name="confirm_password" placeholder="Repeat password" required />
                    </div>
                </div>

                <div class="terms-row">
                    <input type="checkbox" id="terms" required />
                    <label for="terms">I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a></label>
                </div>

                <button type="submit" class="submit-btn">Sign Up</button>
            </form>

            <div class="divider">or continue with</div>

            <div class="oauth-buttons">
                <a href="{% url 'google_login' %}" class="oauth-btn">
                    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Continue with Google
                </a>
                <a href="{% url 'github_login' %}" class="oauth-btn">
                    <svg viewBox="0 0 24 24" fill="#c0c8d4"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
                    Continue with GitHub
                </a>
            </div>

            <p class="footer-text">
                Already have an account? <a href="{% url 'login' %}">Log in</a>
            </p>
        </div>
    </div>
</body>
</html>
