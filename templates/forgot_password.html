{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#2563eb">
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js');
}
</script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Smart Vision</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #101922;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            width: 100%; max-width: 420px;
            background: #1a2332;
            border: 1px solid #2e3e50;
            border-radius: 10px;
            padding: 2rem;
        }
        .card-header { text-align: center; margin-bottom: 1.5rem; }
        .card-title { font-size: 1.5rem; font-weight: 700; color: white; margin-bottom: 0.4rem; }
        .card-subtitle { color: #7a8a9e; font-size: 0.85rem; line-height: 1.5; }

        .success-box {
            background: rgba(34,197,94,0.1);
            border: 1px solid rgba(34,197,94,0.4);
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: none;
        }
        .success-box.show { display: block; }
        .success-box h4 { color: #22c55e; font-size: 0.9rem; margin-bottom: 0.25rem; }
        .success-box p { color: #4ade80; font-size: 0.8rem; }

        .error-box {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.4);
            border-radius: 6px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            color: #f87171;
            font-size: 0.85rem;
        }
        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block; font-size: 0.85rem; font-weight: 500;
            color: #c0c8d4; margin-bottom: 0.4rem;
        }
        .form-group input {
            width: 100%; height: 44px; padding: 0 12px;
            background: #192633; border: 1px solid #2e3e50;
            border-radius: 6px; color: white; font-size: 0.9rem; font-family: inherit;
        }
        .form-group input:focus { outline: none; border-color: #2563eb; }
        .form-group input::placeholder { color: #556677; }

        .submit-btn {
            width: 100%; height: 44px; background: #2563eb; color: white;
            border: none; border-radius: 6px; font-size: 0.95rem;
            font-weight: 600; cursor: pointer; font-family: inherit;
        }
        .submit-btn:hover { background: #1d4ed8; }

        .footer-links {
            margin-top: 1.5rem; padding-top: 1rem;
            border-top: 1px solid #2e3e50; text-align: center;
        }
        .footer-links a {
            color: #7a8a9e; font-size: 0.85rem; text-decoration: none;
        }
        .footer-links a:hover { color: #2563eb; }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h1 class="card-title">Forgot Password</h1>
            <p class="card-subtitle">Enter your email and we'll send you a reset link.</p>
        </div>

        <div id="successMsg" class="success-box">
            <h4>Email Sent</h4>
            <p>Check your inbox for the reset link. It expires in 1 hour.</p>
        </div>

        {% if error %}
        <div class="error-box">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{% url 'forgot_password' %}" id="resetForm">
            {% csrf_token %}
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="name@example.com" required />
            </div>
            <button type="submit" class="submit-btn">Send Reset Link</button>
        </form>

        <div class="footer-links">
            <a href="{% url 'login' %}">&larr; Back to Login</a>
        </div>
    </div>

    <script>
        var params = new URLSearchParams(window.location.search);
        if (params.get('success') === 'true') {
            document.getElementById('successMsg').classList.add('show');
            document.getElementById('resetForm').style.display = 'none';
        }
    </script>
</body>
</html>
